services:
  # Internal Database
  database:
    build: ./services/database
    image: nigelnakajima/telco-database:v1
    container_name: database
    environment:
      POSTGRES_DB: ${INTERNAL_DB_NAME:-telco_churn_db}
      POSTGRES_USER: ${INTERNAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${INTERNAL_DB_PASSWORD:-postgrespassword}
    ports:
      - "${INTERNAL_DB_PORT:-5432}:${INTERNAL_DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INTERNAL_DB_USER:-postgres} -d ${INTERNAL_DB_NAME:-telco_churn_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # Database loader
  # One-off job: loads the Excel data into the database tables
  db-loader:
    build: ./services/database/loader
    container_name: db-loader
    image: nigelnakajima/telco-database-loader:v1
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-telco_churn_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      DATA_DIR: /data
    volumes:
      - "./data/telco_data:/data:ro"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend-net
    profiles:
      - tools
  
  # Database service (to interact with internal database)
  database-service:
    build: ./services/database/api
    image: nigelnakajima/telco-database-service:v1
    container_name: database-service
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-telco_churn_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}

    ports:
      - "${DB_SERVICE_PORT:-8012}:${DB_SERVICE_PORT:-8012}"

    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8012/')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # ML engine
  ml-engine-service:
    build: ./services/ml_engine
    image: hongheng/ml_engine:v1
    container_name: ml-engine-service
    ports:
      - "${ML_ENGINE_PORT:-8010}:${ML_ENGINE_PORT:-8010}"
    environment:
      TRAINING_DATA_PATH: /data/Telco_customer_churn.xlsx
    volumes:
      - "./data/telco_data:/data:ro"
      - ml_model_data:/app/model
    depends_on:
      api-gateway-service:
        condition: service_healthy
      database-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  #  Prediction service
  ml-prediction-service:
    build: ./services/ml_prediction
    image: hongheng/ml_prediction:v1
    container_name: ml-prediction-service
    ports:
      - "${ML_PREDICTION_PORT:-8011}:${ML_PREDICTION_PORT:-8011}"
    env_file:
      - .env
    depends_on:
      api-gateway-service:
        condition: service_healthy
      ml-engine-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net
      
  # Dashboard
  dashboard-service:
    build: ./services/dashboard
    image: nigelnakajima/dashboard:v1
    container_name: dashboard-service
    ports:
      - "${DASHBOARD_PORT:-8501}:${DASHBOARD_PORT:-8501}"
    environment:
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8501}
    depends_on:
      database-service:
        condition: service_healthy
      api-gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  #  API gateway
  api-gateway-service:
    build: ./services/api_gateway
    image: nigelnakajima/api_gateway:v1
    container_name: api-gateway-service
    ports:
      - "${GATEWAY_PORT:-8008}:${GATEWAY_PORT:-8008}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8008/')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  ingress-proxy:
    image: nginx:alpine
    container_name: ingress-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dashboard-service:
        condition: service_healthy
      ml-prediction-service:
        condition: service_healthy
      api-gateway-service:
        condition: service_healthy
    networks:
      - backend-net
      
volumes:
  postgres_data:
  ml_model_data:

networks:
  backend-net:
    driver: bridge

