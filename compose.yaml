services:
  # Internal Database
  database:
    build: ./services/database
    container_name: telco_database
    environment:
      POSTGRES_DB: ${INTERNAL_DB_NAME:-telco_churn_db}
      POSTGRES_USER: ${INTERNAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${INTERNAL_DB_PASSWORD:-postgrespassword}
    ports:
      - "${INTERNAL_DB_PORT:-5432}:${INTERNAL_DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-telco_churn_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-net

  # Database loader
  # One-off job: loads the Excel data into the database tables
  # Run explicitly with: docker compose run --rm db_loader
  db_loader:
    build: ./services/database/loader
    container_name: telco_db_loader
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-telco_churn_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      DATA_DIR: /data
    volumes:
      - "./data/telco_data:/data:ro"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend-net
    profiles:
      - tools
  
  # Database service (to interact with internal database)
  database_service:
    build: ./services/database/api
    container_name: telco_database_service
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-telco_churn_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgrespassword}

    ports:
      - "${DATABASE_PORT:-5000}:${DATABASE_PORT:-5000}"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

    depends_on:
      database:
        condition: service_healthy

    networks:
      - backend-net

  # ML engine
  ml_engine:
    build: ./services/ml_engine
    container_name: telco_ml_engine
    ports:
      - "${ML_ENGINE_PORT:-8010}:${ML_ENGINE_PORT:-8010}"
    environment:
      TRAINING_DATA_PATH: /data/Telco_customer_churn.xlsx
    volumes:
      - "./data/telco_data:/data:ro"
      - ml_model_data:/app/model
    depends_on:
      database_service:
        condition: service_healthy
    networks:
      - backend-net

  #  Prediction service
  ml_prediction:
    build: ./services/ml_prediction
    container_name: telco_ml_prediction
    ports:
      - "${ML_PREDICTION_PORT:-8011}:${ML_PREDICTION_PORT:-8011}"
    env_file:
      - .env
    depends_on:
      ml_engine:
        condition: service_started
      database_service:
        condition: service_healthy
    networks:
      - backend-net
      
  # Dashboard
  dashboard:
    build: ./services/dashboard
    container_name: telco_dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:${DASHBOARD_PORT:-8501}"
    environment:
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8501}
    depends_on:
      database_service:
        condition: service_healthy
    networks:
      - backend-net

  #  API gateway
  api_gateway:
    build: ./services/api_gateway
    image: nigelnakajima/api_gateway:v1
    container_name: telco_api_gateway
    ports:
      - "${GATEWAY_PORT:-8008}:${GATEWAY_PORT:-8008}"
    env_file:
      - .env
    depends_on:
      ml_engine:
        condition: service_started
      dashboard:
        condition: service_started
      database_service:
        condition: service_healthy
    networks:
      - backend-net

volumes:
  postgres_data:
  ml_model_data:

networks:
  backend-net:
    driver: bridge