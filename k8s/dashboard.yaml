apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deployment
  namespace: default
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard
        image: nigelnakajima/dashboard:v1
        imagePullPolicy: IfNotPresent
        command: ["streamlit"]
        args:
          - "run"
          - "app.py"
          - "--server.port=8501"
          - "--server.address=0.0.0.0"
          - "--server.baseUrlPath=/dashboard"
          - "--server.enableCORS=false"
          - "--server.enableXsrfProtection=false"
        ports:
        - containerPort: 8501        
        env:
          # Use explicit environment variables for Streamlit config
          - name: STREAMLIT_SERVER_ENABLE_CORS
            value: "false"
          - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
            value: "false"
          - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
            value: "false"
        envFrom:
        - configMapRef:
            name: config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Health checks updated with the base URL path
        livenessProbe:
          httpGet:
            path: /dashboard/_stcore/health
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /dashboard/_stcore/health
            port: 8501
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: dashboard
  ports:
  - port: 8501
    targetPort: 8501
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dashboard-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dashboard-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70   # Target average CPU at 70%
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75