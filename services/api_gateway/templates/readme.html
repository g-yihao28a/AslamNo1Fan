<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README Viewer</title>

  <!-- Tailwind CSS + Typography Plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- Markdown Parser (Marked) & XSS Sanitizer (DOMPurify) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 md:p-12">

  <main class="max-w-4xl mx-auto">
    <!-- Container where rendered markdown is injected -->
    <article id="content" class="prose prose-slate dark:prose-invert max-w-none">
      <p class="text-slate-400 animate-pulse">Loading README.md...</p>
    </article>
    <!-- Navigation Footer -->
    <div class="flex items-center justify-between pt-2 px-2">
      <a href="./" class="text-xs text-slate-400 hover:text-slate-200 transition">
        &larr; Return to homepage
      </a>
    </div>
  </main>

  <script>
    async function renderReadme() {
      const container = document.getElementById('content');

      try {
        // Fetch readme.d file
        const response = await fetch('https://raw.githubusercontent.com/g-yihao28a/AslamNo1Fan/main/README.md');
        
        if (!response.ok) {
          throw new Error(`Failed to load README.md (${response.status})`);
        }

        const markdownText = await response.text();

        // Parse Markdown to HTML
        const rawHtml = marked.parse(markdownText);

        // Sanitise HTML to prevent security vulnerabilities
        const cleanHtml = DOMPurify.sanitize(rawHtml);

        // Inject into document
        container.innerHTML = cleanHtml;

      } catch (err) {
        container.innerHTML = `
          <div class="p-4 bg-rose-950/50 border border-rose-800 rounded-xl text-rose-300">
            <strong>Error loading file:</strong> ${err.message}
          </div>
        `;
      }
    }

    renderReadme();
  </script>

</body>
</html>
