<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Gateway</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 text-center antialiased">

  <main class="max-w-md w-full space-y-6">
    <!-- Header Section -->
    <header class="space-y-2">
      <h1 class="text-3xl font-bold tracking-tight text-white">API Gateway</h1>
      <p class="text-slate-400 text-sm">Access core endpoints, documentation, and client tools.</p>
    </header>

    <!-- Redirect to dashboard page -->
    <a 
      href="/dashboard" 
      class="inline-flex items-center justify-center w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/25 active:scale-[0.98]"
    >
      Dashboard
    </a>

    <!-- Redirect to database page -->
    <a 
      href="/database" 
      class="inline-flex items-center justify-center w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/25 active:scale-[0.98]"
    >
      Database
    </a>

    <!-- Redirect to machine learning page -->
    <a 
      href="/ml" 
      class="inline-flex items-center justify-center w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/25 active:scale-[0.98]"
    >
      Machine Learning
    </a>
    <!-- Navigation Footer -->
    <div class="flex items-center justify-between pt-2 px-2">
      <a href="/readme" class="text-xs text-slate-400 hover:text-slate-200 transition">
        &larr; View Documentation
      </a>
    </div>
  </main>

</body>
</html>
